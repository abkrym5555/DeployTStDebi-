name: Deploy-react

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - users: action/checkout@v2
      - runs: docker login -u ${{ secrets.DK_USERNAME }} - ${{ secrets.DK_PASS }}
      - run: docker build -t docker-react-test -f Dockerfile.dev .
      - run: docker run -e CI=true docker-react-test npm run test
